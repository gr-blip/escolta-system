name: Daily Backup to Google Drive

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 03:00 Brasília
  workflow_dispatch:       # disparo manual pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Install postgresql-client (pg_dump)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Run Backup Script
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GCP_SA_KEY_JSON:  ${{ secrets.GCP_SA_KEY_JSON }}
          RAILWAY_TOKEN:    ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_APP_URL:  ${{ secrets.RAILWAY_APP_URL }}
        run: python backup_drive_standalone.py
